<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">Kiến trúc Stock Liquidity Intelligence</title>
  <desc id="desc">Luồng dữ liệu SSI qua collector, SQLite, FastAPI và dashboard web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf7"/><stop offset="1" stop-color="#e9f3ed"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#078653"/><stop offset="1" stop-color="#005c3c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12382a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#169269"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#123c2c}.sub{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#597468}
      .head{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#153e2d}.body{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#526a5e}
      .small{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#637c70}.white{fill:#fff}.card{fill:#fff;stroke:#d8e7dd;stroke-width:1.5}
      .line{fill:none;stroke:#169269;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="650" rx="28" fill="url(#bg)"/>
  <text x="54" y="65" class="title">Stock Liquidity Intelligence</text>
  <text x="56" y="94" class="sub">Từ dữ liệu thị trường SSI đến các chỉ tiêu thanh khoản có thể kiểm tra</text>
  <g filter="url(#shadow)">
    <rect x="50" y="145" width="220" height="310" rx="22" class="card"/>
    <rect x="310" y="145" width="260" height="310" rx="22" class="card"/>
    <rect x="610" y="145" width="270" height="310" rx="22" class="card"/>
    <rect x="920" y="145" width="310" height="310" rx="22" class="card"/>
  </g>
  <rect x="50" y="145" width="220" height="72" rx="22" fill="url(#green)"/><path d="M50 195h220v22H50z" fill="url(#green)"/>
  <text x="76" y="189" class="head white">Nguồn dữ liệu SSI</text>
  <text x="76" y="257" class="body">FastConnect WebSocket</text><text x="76" y="281" class="small">• Quote / sổ lệnh</text><text x="76" y="304" class="small">• Giao dịch khớp</text>
  <line x1="76" y1="329" x2="244" y2="329" stroke="#e3eee7"/>
  <text x="76" y="361" class="body">SSI Market Data REST</text><text x="76" y="386" class="small">• OHLC ngày lịch sử</text><text x="76" y="422" class="small">Nguồn giá duy nhất</text>
  <rect x="310" y="145" width="260" height="72" rx="22" fill="#e2f3e9"/><path d="M310 195h260v22H310z" fill="#e2f3e9"/>
  <text x="338" y="189" class="head">Collector SSI</text>
  <text x="338" y="257" class="body">1. Xác thực và đăng ký kênh</text><text x="338" y="292" class="body">2. Kiểm tra, chuẩn hóa bản tin</text><text x="338" y="327" class="body">3. Xếp hàng FIFO, ghi theo lô</text><text x="338" y="362" class="body">4. Retry khi SQLite bị khóa</text>
  <rect x="336" y="393" width="208" height="36" rx="18" fill="#f0f7f2"/><text x="355" y="417" class="small">Heartbeat · reconnect · log</text>
  <rect x="610" y="145" width="270" height="72" rx="22" fill="#e2f3e9"/><path d="M610 195h270v22H610z" fill="#e2f3e9"/>
  <text x="638" y="189" class="head">SQLite cục bộ</text>
  <text x="638" y="257" class="body">database/sli.sqlite3</text><text x="638" y="285" class="small">OHLC · observations · bars</text><text x="638" y="309" class="small">trade ticks · catalog · trạng thái</text>
  <line x1="638" y1="331" x2="852" y2="331" stroke="#e3eee7"/>
  <text x="638" y="359" class="body">Kho lưu theo phiên</text><text x="638" y="387" class="small">database/YYYY-MM-DD.sqlite</text><text x="638" y="419" class="small">Dữ liệu runtime giữ trên máy</text>
  <rect x="920" y="145" width="310" height="72" rx="22" fill="url(#green)"/><path d="M920 195h310v22H920z" fill="url(#green)"/>
  <text x="950" y="189" class="head white">FastAPI + Dashboard</text>
  <text x="950" y="257" class="body">API đọc dữ liệu đã lưu</text><text x="950" y="289" class="small">Tổng quan · Danh mục</text><text x="950" y="315" class="small">Chi tiết · Xếp hạng · Cảnh báo</text><text x="950" y="341" class="small">Dữ liệu &amp; phương pháp</text>
  <line x1="950" y1="365" x2="1200" y2="365" stroke="#e3eee7"/>
  <text x="950" y="397" class="body">SSE cập nhật trạng thái phiên</text><text x="950" y="423" class="small">Không tự gửi lệnh giao dịch</text>
  <path d="M270 300H300" class="line"/><path d="M570 300H600" class="line"/><path d="M880 300H910" class="line"/>
  <rect x="50" y="500" width="1180" height="95" rx="20" fill="#0a3b2b"/>
  <text x="80" y="538" class="head white">Nguyên tắc dữ liệu</text><text x="80" y="570" class="body white">Lưu bản tin SSI đã nhận · không tạo dữ liệu thay thế · OHLC lịch sử tách biệt với quote và sổ lệnh trong phiên.</text>
  <text x="54" y="627" class="small">SLI · Công cụ quan sát thanh khoản, không phải hệ thống dự báo hay đặt lệnh</text>
</svg>
