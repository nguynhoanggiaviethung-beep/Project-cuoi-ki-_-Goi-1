<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Cấu trúc repository Stock Liquidity Intelligence</title>
  <desc id="desc">Sơ đồ các thư mục backend, frontend, scripts, tests, database và cấu hình.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7faf7"/><stop offset="1" stop-color="#e9f3ed"/></linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087e52"/><stop offset="1" stop-color="#034b34"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#12382a" flood-opacity=".09"/></filter>
    <style>
      .title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#fff}.sub{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#d4e8dd}
      .section{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#123c2c}.name{font:700 16px 'Cascadia Code',Consolas,monospace;fill:#087e52}
      .body{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#536d60}.mono{font:500 14px 'Cascadia Code',Consolas,monospace;fill:#3b5b4b}
      .label{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#087e52;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1280" height="700" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="116" rx="28" fill="url(#header)"/><path d="M0 88h1280v28H0z" fill="url(#header)"/>
  <text x="48" y="54" class="title">Cấu trúc dự án</text>
  <text x="50" y="83" class="sub">Mỗi lớp có một nhiệm vụ rõ ràng, từ thu thập dữ liệu đến giao diện người dùng</text>

  <g filter="url(#shadow)">
    <rect x="42" y="150" width="470" height="500" rx="22" fill="#fff" stroke="#d8e7dd" stroke-width="1.5"/>
    <rect x="540" y="150" width="698" height="500" rx="22" fill="#fff" stroke="#d8e7dd" stroke-width="1.5"/>
  </g>
  <text x="72" y="191" class="label">THƯ MỤC GỐC</text>
  <text x="72" y="226" class="mono">Stock-Liquidity-Intelligence/</text>
  <line x1="88" y1="247" x2="88" y2="586" stroke="#cfe2d6" stroke-width="2"/>
  <g>
    <circle cx="88" cy="270" r="5" fill="#0c9562"/><text x="108" y="275" class="mono">app.py</text>
    <circle cx="88" cy="312" r="5" fill="#0c9562"/><text x="108" y="317" class="mono">src/sli/</text>
    <circle cx="88" cy="354" r="5" fill="#0c9562"/><text x="108" y="359" class="mono">frontend/</text>
    <circle cx="88" cy="396" r="5" fill="#0c9562"/><text x="108" y="401" class="mono">scripts/</text>
    <circle cx="88" cy="438" r="5" fill="#0c9562"/><text x="108" y="443" class="mono">tests/</text>
    <circle cx="88" cy="480" r="5" fill="#0c9562"/><text x="108" y="485" class="mono">database/</text>
    <circle cx="88" cy="522" r="5" fill="#0c9562"/><text x="108" y="527" class="mono">docs/images/</text>
    <circle cx="88" cy="564" r="5" fill="#0c9562"/><text x="108" y="569" class="mono">.env.example · requirements*.txt</text>
  </g>
  <rect x="72" y="600" width="408" height="30" rx="15" fill="#edf6f0"/>
  <text x="92" y="620" class="body">`.env` và SQLite runtime nằm ngoài GitHub</text>

  <text x="576" y="191" class="label">CÁC KHỐI CHỨC NĂNG</text>
  <g>
    <rect x="574" y="214" width="296" height="112" rx="16" fill="#f2f8f4"/>
    <text x="596" y="245" class="name">src/sli/</text>
    <text x="596" y="272" class="body">FastAPI, SSI collector, market clock,</text>
    <text x="596" y="294" class="body">analytics, services và database layer.</text>

    <rect x="892" y="214" width="310" height="112" rx="16" fill="#f2f8f4"/>
    <text x="914" y="245" class="name">frontend/</text>
    <text x="914" y="272" class="body">Trang dashboard, CSS, tương tác,</text>
    <text x="914" y="294" class="body">watchlist và nền giao diện.</text>

    <rect x="574" y="344" width="296" height="112" rx="16" fill="#f2f8f4"/>
    <text x="596" y="375" class="name">scripts/</text>
    <text x="596" y="402" class="body">Worker độc lập, đồng bộ OHLC,</text>
    <text x="596" y="424" class="body">audit dữ liệu và Task Scheduler.</text>

    <rect x="892" y="344" width="310" height="112" rx="16" fill="#f2f8f4"/>
    <text x="914" y="375" class="name">tests/</text>
    <text x="914" y="402" class="body">Kiểm tra lịch phiên, API,</text>
    <text x="914" y="424" class="body">sổ lệnh và logic phân tích.</text>

    <rect x="574" y="474" width="296" height="112" rx="16" fill="#f2f8f4"/>
    <text x="596" y="505" class="name">database/</text>
    <text x="596" y="532" class="body">SQLite chính và file lưu dữ liệu</text>
    <text x="596" y="554" class="body">theo ngày trên máy cục bộ.</text>

    <rect x="892" y="474" width="310" height="112" rx="16" fill="#f2f8f4"/>
    <text x="914" y="505" class="name">docs/images/</text>
    <text x="914" y="532" class="body">Sơ đồ kiến trúc và cấu trúc</text>
    <text x="914" y="554" class="body">được nhúng trong README.</text>
  </g>
  <text x="578" y="620" class="body">README.md là điểm bắt đầu để cài môi trường, cấu hình SSI và chạy web.</text>
</svg>
